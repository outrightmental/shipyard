# A fleet member's own settings: how its engines run on this machine.
# Copy to ~/.shipyard/env.yaml (or $SHIPYARD_HOME/env.yaml). Every key is
# optional, and the member reads the file when it starts.
#
# What the member works on is never set here. The repositories assigned to
# it, the size of its engine pool and its GitHub access all come from
# Shipyard (Fleet and Repositories, in the console), and a key about any of
# them in this file is left out.

# The models and effort its engines use on this machine. When set, these
# override the platform-wide defaults an operator configures in Shipyard
# (Repositories → Engine defaults). Shipyard's hard defaults otherwise.
# claude_code_initial_model: claude-opus-5-5
# claude_code_review_model: claude-sonnet-5-5
# claude_code_initial_effort: xhigh
# claude_code_review_effort: high
# claude_describe_model: claude-haiku-5-5

# How long a single Claude run may take before it is ended (default 10800 = 3h).
# A run cut short is not thrown away: what it committed is pushed as an
# incomplete draft PR.
# claude_timeout_seconds: 10800

# The least time between an engine's cycles (default 60).
# cycle_minimum_seconds: 60

# A checkout for open work that no engine is using is removed once untouched
# this many hours (default 24), and recreated when it is next needed.
# checkout_retention_hours: 24

# Free space (GB) to keep on the disk holding ~/.shipyard/checkouts (default 10).
# Below it idle checkouts are removed, and if that is not enough no new work
# starts until there is room. 0 turns it off.
# min_free_disk_gb: 10

# The port of the member's own dashboard on this machine (default 3000).
# dashboard_port: 3000

# The Claude account's usage is read with the login the Claude CLI already
# uses. Set this only to read a different account's.
# anthropic_usage_token: <claude login access token>
